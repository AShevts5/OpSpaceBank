services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspacebank
      POSTGRES_PASSWORD: opspacebank
      POSTGRES_DB: opspacebank
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspacebank"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://opspacebank:opspacebank@db:5432/opspacebank
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  pgdata:
