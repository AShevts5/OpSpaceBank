<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OpSpaceBank — учебный помощник банка: дискретная математика в бизнес-процессах. Пошаговые решения, наводящие вопросы и AI-консультант." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#063A2A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OpSpaceBank" />
    <title>OpSpaceBank — помощник банка</title>
    <script>
      // тема до первой отрисовки, чтобы страница не мигала
      try {
        var t = localStorage.getItem('osb-theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для работы OpSpaceBank включите JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
